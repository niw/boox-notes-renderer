[package]
name = "boox-notes-renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "boox_notes_renderer"

[[bin]]
name = "boox-notes-renderer"
required-features = ["cli"]

[features]
# The binary's CLI-only dependencies. Library consumers can skip building
# clap/anyhow with `default-features = false`.
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
allsorts = "0.17"
anyhow = { version = "1.0.102", optional = true }
base64 = "0.22"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"], optional = true }
dirs = "6"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
printpdf = { version = "0.9.1", features = ["jpeg", "png"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tiny-skia = "0.12"
ureq = "3"
ttf-parser = "0.25"
zip = "8.6.0"
